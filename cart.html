<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — 3D BY SS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --blue1: #1893f6;
      --blue2: #12e0f6;
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      z-index: 100;
    }

    .nav-logo {
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back-btn:hover { color: var(--text); }

    .page {
      max-width: 700px;
      margin: 50px auto;
      padding: 0 20px 80px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

    .empty {
      text-align: center;
      padding: 80px 20px;
      display: none;
    }

    .empty.show { display: block; }

    .empty-icon { font-size: 64px; margin-bottom: 20px; }

    .empty h2 { color: var(--muted); font-size: 20px; margin-bottom: 12px; }

    .empty a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border-radius: 30px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .cart-list { display: flex; flex-direction: column; gap: 14px; }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .item-emoji {
      font-size: 36px;
      width: 56px;
      height: 56px;
      background: #222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-info { flex: 1; }

    .item-name { font-size: 16px; font-weight: bold; margin-bottom: 4px; }

    .item-price {
      font-size: 15px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #222;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }

    .qty-num { font-size: 16px; font-weight: bold; }

    .remove-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 20px;
      cursor: pointer;
    }

    .note-section {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .note-section textarea {
      width: 100%;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px;
    }

    .summary {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .summary-row.total {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-btn {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: none;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">3D BY SS</a>
    <a href="products.html" class="back-btn">← Keep Shopping</a>
  </nav>

  <div class="page">
    <h1>Your Cart</h1>
    <p class="subtitle" id="itemCount">0 items</p>

    <div class="empty" id="emptyState">
      <div class="empty-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <a href="products.html">Browse Products</a>
    </div>

    <div id="cartContent">
      <div class="cart-list" id="cartList"></div>

      <div class="note-section">
        <textarea id="orderNote" placeholder="e.g. I want the keychain in blue with the name 'Sara'..."></textarea>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>Items</span>
          <span id="summaryItems">0</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span>2 JD</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summaryTotal">0 JD</span>
        </div>
      </div>

      <button class="checkout-btn" onclick="sendOrder()">Send Order</button>
      <button class="clear-btn" onclick="clearCart()">Clear cart</button>
    </div>
  </div>

  <script>
    const WA = "962796960076";
    const DELIVERY_FEE = 2;

    function getCart() {
      return JSON.parse(localStorage.getItem("ss_cart") || "[]");
    }

    function saveCart(cart) {
      localStorage.setItem("ss_cart", JSON.stringify(cart));
    }

    function render() {
      const cart = getCart();
      const list = document.getElementById("cartList");
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const itemsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const total = itemsTotal + (cart.length > 0 ? DELIVERY_FEE : 0);

      document.getElementById("summaryItems").textContent = totalQty;
      document.getElementById("summaryTotal").textContent = total + " JD";

      list.innerHTML = "";
      cart.forEach((item, i) => {
        list.innerHTML += `
          <div class="cart-item">
            <div class="item-emoji">📦</div>
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${item.price * item.qty} JD</div>
            </div>
            <div class="item-controls">
              <button onclick="changeQty(${i},-1)">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${i},1)">+</button>
            </div>
          </div>
        `;
      });
    }

    function changeQty(i, d) {
      let cart = getCart();
      cart[i].qty += d;
      if (cart[i].qty <= 0) cart.splice(i, 1);
      saveCart(cart);
      render();
    }

    function clearCart() {
      saveCart([]);
      render();
    }

    function sendOrder() {
      const cart = getCart();
      const itemsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const total = itemsTotal + DELIVERY_FEE;

      let msg = "Hi! I'd like to place an order from 3D BY SS:\n\n";
      cart.forEach(i => {
        msg += `${i.name} x${i.qty}\n`;
      });
      msg += `Total: ${total} JD`;

      window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(msg));
    }

    render();
  </script>

</body>
</html>

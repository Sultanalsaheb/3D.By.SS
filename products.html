<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — 3D BY SS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --blue1: #1893f6;
      --blue2: #12e0f6;
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    nav {
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      z-index: 100;
    }

    .nav-logo {
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-right { display: flex; align-items: center; gap: 20px; }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text); }

    .cart-icon {
      position: relative;
      text-decoration: none;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      color: white;
      font-size: 10px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    .cart-badge.show { display: flex; }

    /* PAGE HEADER */
    .header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    .header p {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--blue2);
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: clamp(28px, 5vw, 52px);
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header .sub { color: var(--muted); font-size: 15px; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 40px rgba(18, 147, 246, 0.12);
    }

    .card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #222;
      display: block;
    }

    .card-placeholder {
      width: 100%;
      height: 190px;
      background: linear-gradient(135deg, #1a2a3a, #0d1a2a);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }

    .card-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-name {
      font-size: 16px;
      font-weight: bold;
      color: var(--text);
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .add-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .add-btn:hover { opacity: 0.85; transform: scale(1.03); }

    .add-btn.added {
      background: #25D366;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      border: 1px solid var(--blue1);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 999;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px; }
      .card-img, .card-placeholder { height: 130px; }
      .card-body { padding: 12px; }
      .card-desc { display: none; }
      .card-name { font-size: 13px; }
    }

        footer {
            background: #111;
            color: var(--muted);
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--border);
        }
    
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">3D BY SS</a>
    <div class="nav-right">
      <a href="index.html" class="back-link">← Home</a>
      <a href="cart.html" class="cart-icon">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </nav>

  <div class="header">
    <p>Full Collection</p>
    <h1>All Products</h1>
    <p class="sub">Add items to your cart, then send your order via WhatsApp.</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="toast" id="toast"></div>

  <footer><h3>© 2026 3D BY SS | Made in Jordan 🇯🇴</h3></footer>

  <script>
    const WA = "962796960076";

    const PRODUCTS = [
  { id: 1, name: "Espresso Capsule Holder", price: 10, img: "product1.png", emoji: "☕", desc: "Holds coffee pods. Clean and modern look." },
  { id: 2, name: "Funny Door Stop", price: 3, img: "product2.png", emoji: "🚪", desc: "Keeps doors in place. Adds a fun touch." },
  { id: 3, name: "Custom Name Keychains", price: 3, img: "product3.png", emoji: "🔑", desc: "Add your name. Pick color and style." },
  { id: 4, name: "Kitchen Utensil Holder", price: 4, img: "product4.png", emoji: "🍴", desc: "Keeps tools neat and easy to reach." },
  { id: 5, name: "Clicker Fidget", price: 3, img: "product5.png", emoji: "🖱️", desc: "Small clicker. Easy to carry anywhere." },
  { id: 6, name: "Ramadan Calendar", price: 5, img: "product6.png", emoji: "🌙", desc: "Track days of Ramadan. Simple and decorative." },
  { id: 7, name: "Car Logo Keychains", price: 2, img: "product7.png", emoji: "🚗", desc: "Car logos. Great for keys or gifts." },
  { id: 8, name: "MagSafe Charger Stand", price: 5, img: "product8.png", emoji: "📱", desc: "Holds iPhone 12+. Supports Apple Watch." },
  { id: 9, name: "Desk Cable Holder", price: 3, img: "product9.png", emoji: "🔌", desc: "Stops cable mess. Keeps desk clean." },
  { id: 10, name: "Tic Tac Toe", price: 3, img: "product10.png", emoji: "❌", desc: "Small board. Easy to carry and play." },
  { id: 11, name: "Decorative Owl Figurines", price: 15, img: "product11.png", emoji: "🦉", desc: "Set of 2 owls. Modern home decor." },
  { id: 12, name: "Abstract Thinking Statue", price: 3, img: "product12.png", emoji: "🗿", desc: "Simple statue. Clean black and white style." },
  { id: 13, name: "Abstract Face Sculpture", price: 5, img: "product13.png", emoji: "🎭", desc: "Modern face design. Minimal look." },
  { id: 14, name: "Cat Decor", price: 7, img: "product14.png", emoji: "🐱", desc: "Sleeping cat design. Cozy home piece." },
  { id: 15, name: "Dino Keychains", price: 2, img: "product15.png", emoji: "🦕", desc: "Fun dinosaur shapes. Light and strong." },
  { id: 16, name: "Kids Name Keychains", price: 3, img: "product16.png", emoji: "🔑", desc: "Custom names for kids. Bright colors." },
  { id: 17, name: "Infinity Cube Fidget", price: 2, img: "product17.png", emoji: "∞", desc: "Folds and flips. Smooth motion." },
  { id: 18, name: "Wiggling Noodle Fidget", price: 3, img: "product18.png", emoji: "🟢", desc: "Bendy and fun. Good for stress." },
  { id: 19, name: "Twisting Fidget", price: 3, img: "product19.png", emoji: "🌀", desc: "Twists in your hand. Smooth feel." },
  { id: 20, name: "Hexagon Fidget", price: 3, img: "product20.png", emoji: "⬡", desc: "Spins or clicks. Geometric design." },
  { id: 21, name: "Spider Web Fidget", price: 3, img: "product21.png", emoji: "🕸️", desc: "Flexible web shape. Easy to twist." },
  { id: 22, name: "3-in-1 Fidget", price: 2, img: "product22.png", emoji: "🎮", desc: "Spinner, clicker, and roller in one." },
  { id: 23, name: "Mini Flying Plane", price: 2, img: "product23.png", emoji: "✈️", desc: "Small plane. Glides when thrown." },
  { id: 24, name: "Flower Bookmark", price: 3, img: "product24.png", emoji: "🌸", desc: "Light bookmark. Clean floral design." },
  { id: 25, name: "Palestine Keychain", price: 3, img: "product25.png", emoji: "🇵🇸", desc: "Small modern Palestine Keychian with keffiyeh pattern." },
  { id: 26, name: "Leaf Coster", price: 6, img: "product26.JPG", emoji: "🍀", desc: "Small modern set of 4 leaf shaped costers." },
  { id: 27, name: "JORDAN NASHAMA KEYCHAIN", price: 3, img: "product27.JPG", emoji: "🇯🇴", desc: "A keychain of al-nashama’s logo Jordan national football team to show your support." }
]

    function getCart() {
      try { return JSON.parse(localStorage.getItem("ss_cart") || "[]"); } catch { return []; }
    }

    function saveCart(cart) { localStorage.setItem("ss_cart", JSON.stringify(cart)); }

    function updateBadge() {
      const cart = getCart();
      const total = cart.reduce((s, i) => s + i.qty, 0);
      const badge = document.getElementById("cartBadge");
      badge.textContent = total;
      total > 0 ? badge.classList.add("show") : badge.classList.remove("show");
    }

    function addToCart(product) {
      const cart = getCart();
      const existing = cart.find(i => i.name === product.name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ name: product.name, price: product.price, qty: 1 });
      }
      saveCart(cart);
      updateBadge();
      showToast("Added " + product.name + " to cart 🛒");
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
    }

    function buildGrid() {
      const grid = document.getElementById("grid");
      PRODUCTS.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          ${p.img
            ? `<img class="card-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ""
          }
          <div class="card-placeholder" style="display:${p.img ? "none" : "flex"}">${p.emoji}</div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-footer">
              <span class="price">${p.price} JD</span>
              <button class="add-btn" id="btn-${i}" onclick="handleAdd(${i})">+ Add to Cart</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleAdd(i) {
      addToCart(PRODUCTS[i]);
      const btn = document.getElementById("btn-" + i);
      btn.textContent = "✓ Added";
      btn.classList.add("added");
      setTimeout(() => {
        btn.textContent = "+ Add to Cart";
        btn.classList.remove("added");
      }, 1500);
    }

    buildGrid();
    updateBadge();
  </script>

</body>
</html>

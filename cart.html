<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — 3D BY SS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --blue1: #1893f6;
      --blue2: #12e0f6;
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 30px;
      z-index: 100;
    }

    .nav-logo {
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--text); }

    .page {
      max-width: 700px;
      margin: 50px auto;
      padding: 0 20px 80px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 80px 20px;
      display: none;
    }

    .empty.show { display: block; }

    .empty-icon { font-size: 64px; margin-bottom: 20px; }

    .empty h2 { color: var(--muted); font-size: 20px; margin-bottom: 12px; }

    .empty a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border-radius: 30px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    /* CART ITEMS */
    .cart-list { display: flex; flex-direction: column; gap: 14px; }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s;
    }

    .cart-item:hover { border-color: #444; }

    .item-emoji {
      font-size: 36px;
      width: 56px;
      height: 56px;
      background: #222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }

    .item-name { font-size: 16px; font-weight: bold; color: var(--text); margin-bottom: 4px; }

    .item-price {
      font-size: 15px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #222;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      line-height: 1;
    }

    .qty-btn:hover { background: #333; }

    .qty-num {
      font-size: 16px;
      font-weight: bold;
      min-width: 24px;
      text-align: center;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
      margin-left: 4px;
    }

    .remove-btn:hover { color: #ff5555; background: #2a1a1a; }

    /* NOTE FIELD */
    .note-section {
      margin-top: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .note-section label {
      display: block;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .note-section textarea {
      width: 100%;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }

    .note-section textarea:focus { border-color: var(--blue1); }

    /* SUMMARY */
    .summary {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .summary-row.total {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 4px;
      margin-bottom: 0;
    }

    .summary-row.total span:last-child {
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* CHECKOUT */
    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .checkout-btn:hover { background: #1ebe5d; transform: scale(1.02); }

    .checkout-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

    .wa-icon { font-size: 22px; }

    .clear-btn {
      display: block;
      margin: 16px auto 0;
      background: none;
      border: none;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .clear-btn:hover { color: #ff5555; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">3D BY SS</a>
    <a href="products.html" class="back-btn">← Keep Shopping</a>
  </nav>

  <div class="page">
    <h1>Your Cart</h1>
    <p class="subtitle" id="itemCount">0 items</p>

    <div class="empty" id="emptyState">
      <div class="empty-icon">🛒</div>
      <h2>Your cart is empty</h2>
      <p style="color:var(--muted);font-size:14px">Add some products and come back!</p>
      <a href="products.html">Browse Products</a>
    </div>

    <div id="cartContent">
      <div class="cart-list" id="cartList"></div>

      <div class="note-section">
        <label>Any special notes? (color, custom name, size, etc.)</label>
        <textarea id="orderNote" placeholder="e.g. I want the keychain in blue with the name 'Sara'..."></textarea>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>Items</span>
          <span id="summaryItems">0</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summaryTotal">0 JD</span>
        </div>
      </div>

      <button class="checkout-btn" id="checkoutBtn" onclick="sendOrder()">
        <span class="wa-icon">💬</span> Send Order on WhatsApp
      </button>
      <button class="clear-btn" onclick="clearCart()">Clear cart</button>
    </div>
  </div>

  <script>
    const WA = "962796960076";

    const EMOJIS = {
      "Espresso Capsule Holder": "☕",
      "Kitchen Utensil Holder": "🍴",
      "Decorative Owl Figurines": "🦉",
      "Thinking Statue": "🗿",
      "Face Sculpture": "🎭",
      "Cat Decor": "🐱",
      "Ramadan Calendar": "🌙",
      "MagSafe Charger Stand": "📱",
      "Desk Cable Holder": "🔌",
      "Custom Name Keychains": "🔑",
      "Car Logo Keychains": "🚗",
      "Dino Keychains": "🦕",
      "Kids Name Keychains": "🔑",
      "Clicker Fidget": "🖱️",
      "Infinity Cube Fidget": "∞",
      "Wiggling Noodle Fidget": "🟢",
      "Twisting Fidget": "🌀",
      "Hexagon Fidget": "⬡",
      "Spider Web Fidget": "🕸️",
      "3-in-1 Fidget": "🎮",
      "Funny Door Stopper": "🚪",
      "Tic Tac Toe": "❌",
      "The Flying Plane": "✈️",
      "Flower Bookmark": "🌸",
    };

    function getCart() {
      try { return JSON.parse(localStorage.getItem("ss_cart") || "[]"); } catch { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem("ss_cart", JSON.stringify(cart));
    }

    function render() {
      const cart = getCart();
      const empty = document.getElementById("emptyState");
      const content = document.getElementById("cartContent");
      const list = document.getElementById("cartList");
      const countEl = document.getElementById("itemCount");
      const summaryItems = document.getElementById("summaryItems");
      const summaryTotal = document.getElementById("summaryTotal");
      const checkoutBtn = document.getElementById("checkoutBtn");

      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const totalPrice = cart.reduce((s, i) => s + i.price * i.qty, 0);

      countEl.textContent = totalQty === 0 ? "0 items" : totalQty + " item" + (totalQty !== 1 ? "s" : "");

      if (cart.length === 0) {
        empty.classList.add("show");
        content.style.display = "none";
        return;
      }

      empty.classList.remove("show");
      content.style.display = "block";

      summaryItems.textContent = totalQty;
      summaryTotal.textContent = totalPrice + " JD";
      checkoutBtn.disabled = false;

      list.innerHTML = "";
      cart.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <div class="item-emoji">${EMOJIS[item.name] || "📦"}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">${item.price * item.qty} JD</div>
          </div>
          <div class="item-controls">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            <button class="remove-btn" onclick="removeItem(${idx})" title="Remove">×</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function changeQty(idx, delta) {
      const cart = getCart();
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      saveCart(cart);
      render();
    }

    function removeItem(idx) {
      const cart = getCart();
      cart.splice(idx, 1);
      saveCart(cart);
      render();
    }

    function clearCart() {
      if (confirm("Clear your entire cart?")) {
        saveCart([]);
        render();
      }
    }

    function sendOrder() {
      const cart = getCart();
      if (cart.length === 0) return;

      const note = document.getElementById("orderNote").value.trim();
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

      let msg = "Hi! I'd like to place an order from 3D BY SS:\n\n";
      cart.forEach(item => {
        msg += `• ${item.name} x${item.qty} — ${item.price * item.qty} JD\n`;
      });
      msg += `\nTotal: ${total} JD`;
      if (note) msg += `\n\nNotes: ${note}`;

      window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(msg), "_blank");
    }

    render();
  </script>

</body>
</html>

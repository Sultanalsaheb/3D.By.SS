<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — 3D BY SS</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --blue1: #1893f6;
      --blue2: #12e0f6;
      --bg: #080808;
      --surface: #111111;
      --surface2: #181818;
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.14);
      --text: #f0f0f0;
      --muted: #666;
      --muted2: #444;
      --accent: #1893f6;
      --wa: #25D366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 36px;
    }

    .nav-logo {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: normal;
      text-transform: none;
      text-decoration: none;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--text);
    }

    /* ── LAYOUT ── */
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    /* ── HEADER ── */
    .header {
      margin-bottom: 48px;
    }

    .header-eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      margin-bottom: 10px;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }

    .header .item-count {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── EMPTY ── */
    .empty {
      display: none;
      text-align: center;
      padding: 100px 20px;
      flex-direction: column;
      align-items: center;
    }

    .empty.show {
      display: flex;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
    }

    .empty h2 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .empty a {
      display: inline-block;
      padding: 13px 30px;
      border-radius: 40px;
      background: linear-gradient(110deg, var(--blue1), var(--blue2));
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* ── CART ITEMS ── */
    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .cart-item:first-child {
      border-radius: 16px 16px 0 0;
    }

    .cart-item:last-child {
      border-radius: 0 0 16px 16px;
    }

    .cart-item:only-child {
      border-radius: 16px;
    }

    .cart-item:hover {
      background: var(--surface2);
      border-color: var(--border-hover);
    }

    .item-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(24, 147, 246, 0.12), rgba(18, 224, 246, 0.06));
      border: 1px solid rgba(24, 147, 246, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .item-unit-price {
      font-size: 12px;
      color: var(--muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .qty-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .qty-btn:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .qty-num {
      width: 32px;
      text-align: center;
      font-weight: 500;
      font-size: 15px;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      line-height: 36px;
    }

    .item-subtotal {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      min-width: 52px;
      text-align: right;
      background: linear-gradient(110deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--muted2);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
      font-size: 16px;
    }

    .remove-btn:hover {
      color: #e24b4b;
      background: rgba(226, 75, 75, 0.1);
    }

    /* ── NOTE ── */
    .note-section {
      margin-top: 24px;
    }

    .note-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      margin-bottom: 10px;
    }

    .note-section textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      padding: 16px 18px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      resize: none;
      height: 90px;
      transition: border-color 0.2s;
      outline: none;
    }

    .note-section textarea:focus {
      border-color: rgba(24, 147, 246, 0.4);
    }

    .note-section textarea::placeholder {
      color: var(--muted2);
    }

    /* ── SUMMARY ── */
    .summary {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--muted);
      padding: 7px 0;
    }

    .summary-row .val {
      color: var(--text);
    }

    .summary-row.total {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 18px;
      font-family: 'DM Sans', sans-serif;
    }

    .summary-row.total .val {
      background: linear-gradient(110deg, var(--blue1), var(--blue2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .delivery-badge {
      font-size: 11px;
      background: rgba(24, 147, 246, 0.12);
      color: var(--blue2);
      border: 1px solid rgba(24, 147, 246, 0.2);
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    /* ── ACTIONS ── */
    .actions {
      margin-top: 16px;
    }

    .checkout-btn {
      width: 100%;
      padding: 17px;
      border-radius: 14px;
      border: none;
      background: #1aaa57;
      background: linear-gradient(110deg, #1aaa57, #25D366);
      color: white;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .checkout-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .checkout-btn:active {
      transform: translateY(0);
    }

    .wa-icon {
      width: 20px;
      height: 20px;
    }

    .clear-btn {
      display: block;
      margin: 14px auto 0;
      background: none;
      border: none;
      color: var(--muted2);
      font-size: 13px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: #e24b4b;
    }

    /* ── FADE IN ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cart-item {
      animation: fadeUp 0.35s ease both;
    }

    .cart-item:nth-child(1) {
      animation-delay: 0.05s;
    }

    .cart-item:nth-child(2) {
      animation-delay: 0.10s;
    }

    .cart-item:nth-child(3) {
      animation-delay: 0.15s;
    }

    .cart-item:nth-child(4) {
      animation-delay: 0.20s;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="nav-logo">3D BY SS</a>
    <a href="products.html" class="back-btn">← Keep Shopping</a>
  </nav>

  <div class="page">
    <div class="header">
      <p class="header-eyebrow">Review & Order</p>
      <h1>Your Cart</h1>
      <p class="item-count" id="itemCount">0 items</p>
    </div>

    <!-- Empty state -->
    <div class="empty" id="emptyState">
      <div class="empty-icon">🛒</div>
      <h2>Nothing here yet</h2>
      <p>Browse our products and add something you love.</p>
      <a href="products.html">Browse Products</a>
    </div>

    <!-- Cart content -->
    <div id="cartContent">
      <div class="cart-list" id="cartList"></div>

      <div class="note-section">
        <p class="note-label">Order Notes</p>
        <textarea id="orderNote" placeholder="e.g. I want the keychain in blue with the name 'Sara'…"></textarea>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span class="val" id="summaryItems">0 JD</span>
        </div>
        <div class="summary-row">
          <span>
            Delivery
            <span class="delivery-badge">Amman</span>
          </span>
          <span class="val">2 JD</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span class="val" id="summaryTotal">0 JD</span>
        </div>
      </div>

      <div class="actions">
        <button class="checkout-btn" onclick="sendOrder()">
          <svg class="wa-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
          </svg>
          Send Order via WhatsApp
        </button>
        <button class="clear-btn" onclick="clearCart()">Clear cart</button>
      </div>
    </div>
  </div>

  <script>
    const WA = "962796960076";
    const DELIVERY_FEE = 2;

    function getCart() {
      return JSON.parse(localStorage.getItem("ss_cart") || "[]");
    }

    function saveCart(cart) {
      localStorage.setItem("ss_cart", JSON.stringify(cart));
    }

    function render() {
      const cart = getCart();
      const list = document.getElementById("cartList");
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const itemsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const total = itemsTotal + (cart.length > 0 ? DELIVERY_FEE : 0);
      const empty = cart.length === 0;

      document.getElementById("itemCount").textContent = totalQty === 1 ? "1 item" : `${totalQty} items`;
      document.getElementById("summaryItems").textContent = itemsTotal + " JD";
      document.getElementById("summaryTotal").textContent = total + " JD";
      document.getElementById("cartContent").style.display = empty ? "none" : "block";
      document.getElementById("emptyState").classList.toggle("show", empty);

      const emojiMap = {
        "Espresso Capsule Holder": "☕",
        "Funny Door Stop": "🚪",
        "Custom Name Keychains": "🔑",
        "Kitchen Utensil Holder": "🍴",
        "Clicker Fidget": "🖱️",
        "Ramadan Calendar": "🌙",
        "Car Logo Keychains": "🚗",
        "MagSafe Charger Stand": "📱",
        "Desk Cable Holder": "🔌",
        "Tic Tac Toe": "❌",
        "Decorative Owl Figurines": "🦉",
        "Abstract Thinking Statue": "🗿",
        "Abstract Face Sculpture": "🎭",
        "Cat Decor": "🐱",
        "Dino Keychains": "🦕",
        "Kids Name Keychains": "🔑",
        "Infinity Cube Fidget": "∞",
        "Wiggling Noodle Fidget": "🟢",
        "Twisting Fidget": "🌀",
        "Hexagon Fidget": "⬡",
        "Spider Web Fidget": "🕸️",
        "3-in-1 Fidget": "🎮",
        "Mini Flying Plane": "✈️",
        "Flower Bookmark": "🌸",
        "Palestine Keychain": "🇵🇸"
      };

      list.innerHTML = "";
      cart.forEach((item, i) => {
        const emoji = emojiMap[item.name] || "📦";
        const div = document.createElement("div");
        div.className = "cart-item";
        div.style.animationDelay = (i * 0.05 + 0.05) + "s";
        div.innerHTML = `
          <div class="item-icon">${emoji}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-unit-price">${item.price} JD each</div>
          </div>
          <div class="item-right">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
              <span class="qty-num">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
            </div>
            <div class="item-subtotal">${item.price * item.qty} JD</div>
            <button class="remove-btn" onclick="changeQty(${i}, -${item.qty})" title="Remove">✕</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function changeQty(i, d) {
      let cart = getCart();
      cart[i].qty += d;
      if (cart[i].qty <= 0) cart.splice(i, 1);
      saveCart(cart);
      render();
    }

    function clearCart() {
      if (!confirm("Clear your entire cart?")) return;
      saveCart([]);
      render();
    }

    function sendOrder() {
      const cart = getCart();
      if (!cart.length) return;
      const note = document.getElementById("orderNote").value.trim();
      const itemsTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const total = itemsTotal + DELIVERY_FEE;

      let msg = "Hi! 👋 I'd like to place an order from *3D BY SS*:\n\n";
      cart.forEach(i => {
        msg += `▪ ${i.name}  x${i.qty}  —  ${i.price * i.qty} JD\n`;
      });
      msg += `\n──────────────\n`;
      msg += `Subtotal: ${itemsTotal} JD\n`;
      msg += `Delivery: ${DELIVERY_FEE} JD\n`;
      msg += `*Total: ${total} JD*`;
      if (note) msg += `\n\n📝 Notes: ${note}`;

      window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(msg));
      saveCart([]);
      render();
    }

    render();
  </script>

</body>

</html>
